<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" role="img" aria-label="How I solve problems: understand, model, build, verify, ship.">
  <rect x=".5" y=".5" width="759" height="329" rx="12" fill="#161617" stroke="#2f2f31"/>
  <path d="M.5 12.5a12 12 0 0 1 12-12h734a12 12 0 0 1 12 12v30H.5z" fill="#232326" stroke="#2f2f31"/>
  <circle cx="24" cy="21" r="6" fill="#ff5f57"/>
  <circle cx="46" cy="21" r="6" fill="#ffbd2e"/>
  <circle cx="68" cy="21" r="6" fill="#28c840"/>
  <text x="380" y="25" text-anchor="middle" font-size="12.5" fill="#8b8b8d">zsh — sarthak@solve — 80x24</text>

  <g font-size="14" fill="#e6e6e6">
    <text x="24" y="76"><tspan fill="#7ee787">$ </tspan>sarthak solve --problem <tspan fill="#e3b341">"messy, real-world"</tspan></text>

    <text x="24" y="118" opacity="0">
      <tspan fill="#79b8ff">[1/4] understand</tspan><tspan x="200">who hurts, what it costs, what "fixed" means</tspan>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.10;0.12;0.95;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="24" y="146" opacity="0">
      <tspan fill="#79b8ff">[2/4] model</tspan><tspan x="200">data, rules, and where AI earns its place</tspan>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.22;0.24;0.95;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="24" y="174" opacity="0">
      <tspan fill="#79b8ff">[3/4] build</tspan><tspan x="200">end to end: schema → API → UI → deploy</tspan>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.34;0.36;0.95;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="24" y="202" opacity="0">
      <tspan fill="#79b8ff">[4/4] verify</tspan><tspan x="200">guardrails, audit trails, deterministic checks</tspan>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.46;0.48;0.95;1" dur="12s" repeatCount="indefinite"/>
    </text>

    <text x="24" y="246" opacity="0">
      <tspan fill="#7ee787">✓ shipped</tspan><tspan fill="#8b8b8d">  — then measure, learn, iterate</tspan>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.60;0.62;0.95;1" dur="12s" repeatCount="indefinite"/>
    </text>

    <text x="24" y="290"><tspan fill="#7ee787">$ </tspan></text>
  </g>
  <rect x="42" y="278" width="8" height="15" fill="#e6e6e6">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.4;0.5;0.9;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
